<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mystro banner</title>
<desc>Mystro wordmark with wand-and-asset icon mark, tagline "Asset Generation and Management Engine", on a dark precision-instrument panel.</desc>

<rect x="0" y="0" width="1600" height="400" fill="#0A0A0B"/>
<rect x="24" y="24" width="1552" height="352" fill="none" stroke="#2A2723" stroke-width="1"/>

<!-- corner ticks -->
<g stroke="#E8833A" stroke-width="1.5" opacity="0.65">
  <path d="M24 60 L24 24 L60 24"/>
  <path d="M1540 24 L1576 24 L1576 60"/>
  <path d="M1576 340 L1576 376 L1540 376"/>
  <path d="M60 376 L24 376 L24 340"/>
</g>

<!-- icon mark, scaled and translated -->
<g transform="translate(90,90) scale(0.44)">
  <polygon points="146,438 176,420 348,150 330,164" fill="#C86A28" stroke="#0A0A0B" stroke-width="3"/>
  <rect x="140" y="428" width="34" height="22" fill="#3A362F"/>
  <polygon points="348,118 362,142 348,166 334,142" fill="#FFB454"/>
  <polygon points="384,108 391,120 384,132 377,120" fill="#FFB454" opacity="0.85"/>
  <polygon points="368,90 373,99 368,108 363,99" fill="#FFB454" opacity="0.6"/>
  <g stroke="#6B5A3F" stroke-width="2.2" stroke-dasharray="6 8">
    <line x1="352" y1="150" x2="398" y2="192"/>
    <line x1="352" y1="150" x2="420" y2="244"/>
    <line x1="352" y1="150" x2="430" y2="292"/>
  </g>
  <rect x="386" y="180" width="26" height="26" fill="#E8833A"/>
  <rect x="408" y="232" width="20" height="20" fill="#C86A28"/>
  <rect x="422" y="280" width="14" height="14" fill="#8A5423"/>
</g>

<!-- wordmark -->
<text x="330" y="222" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="76" font-weight="700" letter-spacing="6" fill="#F2F0EA">MYSTRO</text>

<!-- tagline -->
<text x="332" y="260" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="17" letter-spacing="4" fill="#8A877E">ASSET GENERATION &amp; MANAGEMENT ENGINE</text>

<line x1="332" y1="278" x2="900" y2="278" stroke="#E8833A" stroke-width="1.5" opacity="0.7"/>

<!-- readout -->
<text x="1552" y="358" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" letter-spacing="2" fill="#5A574F">PHELLAMS // MYSTRO.PSM1</text>

</svg>
