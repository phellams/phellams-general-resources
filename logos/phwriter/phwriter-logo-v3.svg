  <title
     id="title1">PHWriter logo concept sheet</title>
  <desc
     id="desc1">Six logo concepts for PHWriter grouped into classic, retro-modern, and modern directions, each derived from motifs in the actual PHWriter terminal output: wavy rule lines, dotted banner padding, a section-marker diamond, and a star callout.</desc>
